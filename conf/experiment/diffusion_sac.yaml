
experiment_name: "Diffusion-SAC"
agent_type: "diffusion_sac"
learning_starts: 10000 # 经验回放开始训练的步数
lr_actor_initial: 5e-5
lr_critic_initial: 1.5e-4
lr_final: 1e-6
total_timesteps: 100000
qne_k_samples: 64 # QNE中的K值 表示每次生成几个候选解
qne_temperature: 0.01 # QNE的温度参数，用于控制Softmax的平滑度
policy_kwargs:
  T: 19 # 扩散模型的时间步数
  net_arch: [256, 256] # 神经网络的架构
wrapper_kwargs:
  ue_embedding_dim: 8 # 用户设备的嵌入向量维度
