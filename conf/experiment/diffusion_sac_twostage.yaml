# 文件路径: conf/experiment/diffusion_sac_twostage.yaml

defaults:
  - _self_
  # 这一行告诉Hydra，去顶级的`conf`目录下找`teacher_config`文件夹，
  # 然后加载`vanilla_sac_teacher.yaml`文件。
  # 这完全符合你的同级目录结构。
  - teacher_config: vanilla_sac_teacher

# ---- 下面是你这个实验自己的参数 ----

agent_type: "diffusion_sac"
two_stage_training: true

# 其他 two_stage 实验特有的参数...
learning_starts: 10000
total_timesteps: 100000
qne_k_samples: 64
qne_temperature: 0.01

policy_kwargs:
  T: 19
  net_arch: [256, 256]

wrapper_kwargs:
  ue_embedding_dim: 8