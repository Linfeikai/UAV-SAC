# 顶层的减号'-'表示，整个文件是一个“列表”，列表中的每一项都是一个独立的实验配置。
- 
  # 因为下面的内容相对于 '-' 缩进了2个空格，所以它们都属于列表的第一个元素。
  # 这些是“键: 值”对，构成了一个字典。
  experiment_name: "Rule-Based-Agent"
  agent_type: "rule_based"
  num_episodes: 5 # 这是一个整数类型的值

# 这是列表的第二个元素
- 
  experiment_name: "Vanilla-SAC"
  agent_type: "sac"
  learning_rate: 0.0003 # 数值类型
  gamma: 0.99
  total_timesteps: 100000 # 可以写成科学计数法 1e5，但直接写更清晰
  batch_size: 256 # 经验回放的批量大小
  tau: 0.005 # 软更新参数
  buffer_size: 1000000 # 经验回放的缓冲区大小

# 这是列表的第二个元素
- 
  experiment_name: "Vanilla-SAC-Teacher"
  agent_type: "sac"
  learning_rate: 0.0003 # 数值类型
  gamma: 0.99
  total_timesteps: 100000 # 可以写成科学计数法 1e5，但直接写更清晰
  batch_size: 256 # 经验回放的批量大小
  tau: 0.005 # 软更新参数
  buffer_size: 1000000 # 经验回放的缓冲区大小


# 这是列表的第三个元素
- 
  experiment_name: "DDPG"
  agent_type: "ddpg"
  learning_rate: 0.001 # 数值类型
  gamma: 0.99
  total_timesteps: 100000 # 可以写成科学计数法 1e5，但直接写更清晰
  batch_size: 256 # 经验回放的批量大小
  tau: 0.005 # 软更新参数
  buffer_size: 1000000 # 经验回放的缓冲区大小


- experiment_name: PPO-UAV-Baseline
  agent_type: ppo
  notes: "A baseline PPO experiment with default hyperparameters."
  total_timesteps: 200000
  n_envs: 8
  
  # PPO-specific hyperparameters
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  
  # Wrapper kwargs (if needed)
  wrapper_kwargs:
    ue_embedding_dim: 8

# 这是列表的第四个元素
- 
  experiment_name: "Diffusion-SAC"
  agent_type: "diffusion_sac"
  learning_starts: 10000 # 经验回放开始训练的步数
  lr_actor_initial: 5e-5
  lr_critic_initial: 1.5e-4
  lr_final: 1e-6
  total_timesteps: 100000
  qne_k_samples: 64 # QNE中的K值 表示每次生成几个候选解
  qne_temperature: 0.01 # QNE的温度参数，用于控制Softmax的平滑度
  policy_kwargs:
    T: 19 # 扩散模型的时间步数
    net_arch: [256, 256] # 神经网络的架构
  wrapper_kwargs:
    ue_embedding_dim: 8 # 用户设备的嵌入向量维度

# 这是列表的第四个元素
- 
  experiment_name: "Diffusion-SAC-TwoStage"
  agent_type: "diffusion_sac"
  two_stage_training: true # 【关键】开启两阶段训练模式
  teacher_config_name: Vanilla-SAC-Teacher # 【关键】指定哪个实验配置是老师
  learning_starts: 10000 # 经验回放开始训练的步数
  # learning_rate: 0.00003
  total_timesteps: 100000
  qne_k_samples: 64 # QNE中的K值 表示每次生成几个候选解
  qne_temperature: 0.01 # QNE的温度参数，用于控制Softmax的平滑度
  policy_kwargs:
    T: 19 # 扩散模型的时间步数
    net_arch: [256, 256] # 神经网络的架构
  wrapper_kwargs:
    ue_embedding_dim: 8 # 用户设备的嵌入向量维度


- 
  experiment_name: "DACER"
  agent_type: "dacer_sac"
  learning_starts: 10000 # 经验回放开始训练的步数
  # learning_rate: 0.00003
  total_timesteps: 100000
  qne_k_samples: 64 # QNE中的K值 表示每次生成几个候选解
  qne_temperature: 0.1 # QNE的温度参数，用于控制Softmax的平滑度
  policy_kwargs:
    T: 15 # 扩散模型的时间步数
    net_arch: [256, 256] # 神经网络的架构
  wrapper_kwargs:
    ue_embedding_dim: 8 # 用户设备的嵌入向量维度

# 你还可以定义更复杂的层级，比如超参数
- 
  experiment_name: "My-SAC-v1"
  agent_type: "my_sac_v1"
  total_timesteps: 500000
  # model_params 是一个“键”，它的“值”是另一个字典
  model_params:
    # 下面的内容因为又缩进了2个空格，所以它们属于 model_params
    learning_rate: 0.001
    buffer_size: 100000
    policy_kwargs:
      # policy_kwargs 的值又是一个字典
      net_arch: [256, 256] # 这是一个列表